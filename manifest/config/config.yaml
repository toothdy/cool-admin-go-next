cool: # Cool 应用配置
  eps: false # 是否暴露实体与接口元数据，线上建议关闭
  initDB: false # 是否自动导入模块数据库种子
  initMenu: false # 是否自动导入模块菜单种子

  crud: # CRUD 配置
    softDelete: true # 是否启用回收站软删除
  auth: # 认证配置
    bcrypt: # 密码摘要配置
      cost: 12 # bcrypt 计算成本，生产环境建议使用 12 或更高
    jwt: # JWT 配置
      currentKeyId: primary # 当前签发密钥 ID
      keys: # JWT 签名密钥集合
        primary: "397cdea7af3d5b24d90b04c32655bdfa75244bd2c80ed9430f3261b0cc6d92a3" # 默认签名密钥
    session: # 登录会话配置
      type: redis # 会话存储类型 memory | redis
    risk: # 登录与验证码风控配置
      type: redis # 单实例默认使用 redis | memory
      captcha:
        rateLimit: 10 # 每个 IP 每分钟最多生成次数
        outstandingPerIP: 5 # 每个 IP 最多保留的未消费验证码

      login:
        ipRateLimit: 20 # 每个 IP 每分钟最多登录次数
        failureLimit: 5 # 账号连续失败后开始临时封禁

  outbox: # 可靠消息配置
    enabled: false # 是否启用事务消息 Outbox、Inbox 与可靠投递
  transports: # 服务传输配置
    http: # HTTP 服务配置
      enabled: true # 是否启用 HTTP Transport
      address: 0.0.0.0 # HTTP 监听地址
      port: 8001 # HTTP 监听端口
    grpc: # gRPC 服务配置
      enabled: false # 是否启用 gRPC Transport

logger: # GoFrame 系统运行日志配置
  path: logs # 日志文件目录
  file: "{Y-m-d}.log" # 按日期生成日志文件
  level: all # 日志级别
  stdout: true # 是否同时输出到终端

database: # 数据库配置
  default: # 默认数据库连接组
    - link: "mysql:root:123456@tcp(127.0.0.1:3306)/cool-go?loc=Local&parseTime=true&charset=utf8mb4" # MySQL 连接地址
      createdAt: createTime # 自动维护的创建时间字段
      updatedAt: updateTime # 自动维护的更新时间字段

redis: # Redis 配置
  default: # 默认 Redis 连接组
    address: "127.0.0.1:6379" # Redis 服务地址
    db: 0 # Redis 数据库编号
